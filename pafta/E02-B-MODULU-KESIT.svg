<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img" aria-label="Sadece cubuk kismi 90 derece dik bukulen, yuvarlak kismi ekran ustune oturan B modulu kesiti">
