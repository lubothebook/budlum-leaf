<rect class="glass" x="40" y="134" width="820" height="556" rx="6"/>
<text class="t h2" x="60" y="162">A · 90° DİK AÇILI L-KESİT · ÇUBUK DİK, YUVARLAK HALKA EKRAN ÜSTÜNDE</text>
<rect x="191.2" y="410.0" width="520.8" height="34.1" rx="3" fill="#dcecff" stroke="#18507e" stroke-width="1.4"/>
<rect x="92.0" y="348.0" width="99.2" height="102.3" rx="8.5" fill="#7f927a" stroke="#5c6b58" stroke-width="1.5"/>
<circle cx="203.6" cy="379.0" r="14.7" fill="#d8dbe0" stroke="#18507e" stroke-width="1.2"/>
