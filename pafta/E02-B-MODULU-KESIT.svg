  <rect class="bg" x="0" y="0" width="1400" height="980"/>
<text class="t h1" x="40" y="52">B MODÜLÜ (REV L.5.0) · 90° DİK L-ÇUBUK, TEK TYPE-C VE KAMERA KESİTİ</text>
<text class="s" x="40" y="78">Kesit B modülünün 90° dik açıyla bükülmüş çubuk omurgasından ve ekran üstüne oturan yuvarlak halkasından geçer. Sadece anten + Type-C çubuğu</text>
<text class="s" x="40" y="97">yukarıda/kenarda dik kalır; yuvarlak kısım ekranın üzerine yerleşir ve ±90° menteşeyle öne/arkaya takılır.</text>
