<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img" aria-label="Yuvarlak kısım ekran üstünde (50MP OIS + Ø22.4 mm AMOLED), sadece 90° bükümlü çubuk (anten + tek Type-C) yukarıda">
  <title>BUDLUM LEAF · 90° BÜKÜMLÜ B MODÜLÜ OPTİK YOL, ARKA PANEL VE ÖNE/ARKAYA TAKILMA</title>
  <style>
