  <rect class="bg" x="0" y="0" width="1400" height="980"/>
<text class="t h1" x="40" y="52">B MODÜLÜ · EKRAN ÜSTÜNDE YUVARLAK KAMERA/PANEL VE 90° BÜKÜMLÜ ÇUBUK</text>
<text class="s" x="40" y="78">B modülünün yuvarlak halkası (Ø32.0 mm dış, Ø24.0 mm iç açıklık) doğrudan ekranın üzerine oturur; sadece soldaki anten + Type-C çubuğu 90° dik açıyla</text>
<text class="s" x="40" y="97">bükülerek ekran kenarında/yukarısında dik kalır. Böylece modül ekranın 4 yönüne ve ÖN veya ARKA yüzüne takılabilir.</text>
<line class="rule" x1="40" y1="136" x2="1360" y2="136"/>
<rect class="glass" x="40" y="152" width="660" height="430" rx="6"/>
