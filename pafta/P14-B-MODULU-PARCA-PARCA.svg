  <rect class="bg" x="0" y="0" width="1400" height="980"/>
<text class="t h1" x="40" y="52">B MODÜLÜ (REV L.5.0) · 90° BÜKÜMLÜ ÇUBUK, TEK TYPE-C VE KAMERA PARÇALARI</text>
<text class="s" x="40" y="78">Revizyon L.5.0 B modülünde sadece soldaki çubuk (anten) kısmı ±90° tersinir titanyum menteşe ile 90° dik açıyla bükülür ve ekran kenarında/yukarısında dik</text>
