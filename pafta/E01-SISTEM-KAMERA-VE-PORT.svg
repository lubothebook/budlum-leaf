<text class="t h2" x="500" y="166">1 · BOŞLUKTAN 90° BÜKÜLEN B MODÜLÜ: 1 MM YATAY ÇUBUK ÜSTTE, YUVARLAK ÖNDE</text>
<text class="s" x="500" y="192">Orijinal b.png tasarımı kesilmeden ve ek menteşe parçası eklenmeden ters çevrilip çubuk ile</text>
<text class="s" x="500" y="211">yuvarlak arasındaki doğal boşluktan 90° dik açıyla bükülmüştür: böylece 1.00 mm (bir milim)</text>
<text class="s" x="500" y="230">çubuk yukarıda yatay olarak durur ve 2.00 mm ekranın üst kenarına tam oturur; çubuk hariç kalan</text>
<text class="s" x="500" y="249">yuvarlak kısım (Ø32/Ø24 mm) ise ekran yüzeyinde bize doğru bakarak durur. Ekranın 4 yönüne ve</text>
<text class="s" x="500" y="268">ön/arka yüzüne takılabilir. Cihazdaki TEK USB Type-C (40W PD 3.1) prizi bu 1 mm yatay üst çubuk</text>
<text class="s" x="500" y="287">içindedir.</text>
