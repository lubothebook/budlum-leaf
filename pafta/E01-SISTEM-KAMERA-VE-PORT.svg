<text class="t h2" x="500" y="438">2 · ORTADAN ARTI (+) 4 PARÇALI ÇİZİKSİZ EKRAN-BATARYA VE GÖZLÜK SAĞLIĞI</text>
<text class="s" x="500" y="464">80.0 x 160.0 x 2.00 mm (68 g) gövde ortadan artı (+) şeklinde 4 eşit tak-çıkar polikarbonat</text>
<text class="s" x="500" y="483">karoya (Q1-Q4; 40x80 mm, 17 g) bölünür. İç + kenarında 12 µm n=1.585 kendi kendini onaran optik</text>
<text class="s" x="500" y="502">elastomer dudak ve Corning kenar-sarımlı elektrotlar sayesinde hiçbir çizik veya birleşim izi</text>
<text class="s" x="500" y="521">görünmez. Her karoda gözlük/el/cep kullanımına uygun yanmaz LLZO/PEO katı-hal pil (4x 3 Wh = 12</text>
<text class="s" x="500" y="540">Wh, sıfır HF gazı, &lt;=36.2 C göz güvenliği, ELF &lt;0.08 µT, SAR 0.054 W/kg, ISO 10993) bulunur; AB</text>
<text class="s" x="500" y="559">2023/1542 gereği 3 sn içinde değişir.</text>
