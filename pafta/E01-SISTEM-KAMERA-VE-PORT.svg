<text class="t h1" x="40" y="52">4-PARÇALI (+) TAK-ÇIKAR EKRAN-BATARYA · PORTSUZ Qİ2 GÖVDE · 90° BÜKÜMLÜ B</text>
<text class="s" x="40" y="78">Revizyon L.5.0 ile kaba alt batarya çıkıntısı tamamen kaldırılmıştır: (1) 80x160x2.00 mm gövde ortadan artı (+) şeklinde 4 eşit tak-çıkar polikarbonat</text>
<text class="s" x="40" y="97">ekran-batarya parçasına (40x80 mm, 4x 3 Wh = 12 Wh yanmaz katı-hal pil) bölünür. (2) Gövdede Type-C yoktur, her Qi/Qi2 pedde kablosuz şarj olur. (3) B</text>
<text class="s" x="40" y="116">modülünün sadece anten+Type-C çubuğu 90° dik bükülür, yuvarlak kamera ekran üstüne oturur.</text>
