<text class="t h2" x="500" y="694">3 · PORTSUZ Qİ2 KABLOSUZ ŞARJ GÖVDESİ VE ZORUNLU B MODÜLÜ MİMARİSİ</text>
<text class="s" x="500" y="720">Ekran gövdesinin altında veya kenarlarında kesinlikle Type-C portu veya fiziksel buton yoktur.</text>
<text class="s" x="500" y="739">4 çeyrek parçanın merkezde (0,0) birleşerek oluşturduğu Ø54.0 mm Qi2.2 MPP ana bobin ve her</text>
<text class="s" x="500" y="758">parçanın kendi içindeki bağımsız Ø22.0 mm Qi alt-bobini sayesinde cihaz herhangi bir standart</text>
<text class="s" x="500" y="777">kablosuz şarj aletinde (15W-25W) şarj olur. Kablolu Type-C şarj/veri, Sıfır-CPU UWB/60GHz</text>
<text class="s" x="500" y="796">mmWave iletişim, 4-Karo Ana TCON ekran sürüşü, kamera ve ses için 90° bükümlü B kamera</text>
<text class="s" x="500" y="815">modülünün takılması zorunludur.</text>
<text class="lbls" x="70" y="812">Sol: 4x (40x80 mm) katı-hal pilli Qi2 karo · Sağ: 90° B modülü</text>
<text class="lbls" x="70" y="830">Gövdede Type-C yok · Tek Type-C B çubuğunda · AB 2023/1542 uyumlu</text>
