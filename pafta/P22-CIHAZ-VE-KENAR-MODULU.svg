<rect x="1046" y="236" width="248" height="18" rx="3" fill="#eef6ff" stroke="#18507e" stroke-width="1.0"/>
<rect x="1046" y="258" width="248" height="38" rx="4" fill="#b8ebd8" stroke="#267862" stroke-width="1.2"/>
<rect x="1046" y="300" width="248" height="18" rx="3" fill="#eef6ff" stroke="#18507e" stroke-width="1.0"/>
<text class="lbls" x="748" y="212">2.00 mm (2 Milim) Biyouyumlu PC + OCA + T-OLED + Yapboz Kilitli Katı-Hal Pil Kesiti</text>
<text class="lbls" x="772" y="250">Sol Karo (Q1): Ön PC + OCA + T-OLED</text>
<text class="lbls" x="772" y="282">3.0 Wh Katı-Hal Pil + Çıktılı Yapboz Dil</text>
<text class="lbls" x="772" y="314">Göz Kalkanı (Mu-Metal) + Arka T-OLED</text>
<text class="lbls" x="1056" y="250">Sağ Karo (Q2): 0.00 mm Sıfır Çerçeve</text>
<text class="lbls" x="1056" y="282">3.0 Wh Katı-Hal Pil + Girdili Yapboz Yuva</text>
<text class="lbls" x="1056" y="314">Orta: Yapboz Kilit + 12 µm n=1.585 Dudak</text>
<text class="lblb" x="730" y="362">Neden %100 Tamamı Esneyebilen Polikarbonat Yapı ve 90° B Nihai Tasarımdır?</text>
<text class="lbls" x="730" y="384">• %100 Tam Alan Esnek Polikarbonat (PC-PDMS): Çoklu nötr düzlemli silikon OCA (G=0.035 MPa) ile</text>
<text class="lbls" x="730" y="402">  polikarbonat kabuk gerinimi %0.35 düzeyine düşer; tüm ekran 1.4 N kuvvetle R=25.5 mm esner.</text>
<text class="lbls" x="730" y="422">• Sıfır Rijit Bölge: Esnek PC-PDMS/NiTi yapboz kilit (24 çift, 10 N/mm) + esnek (0,0) göbek.</text>
<text class="lbls" x="730" y="440">• Çift Eksenli Esnek Katı-Hal Pil (1680 mikro-hücre, 12 Wh, 0 HF, &lt;=36.2 C) + esnek Qi2.2.</text>
<text class="lbls" x="730" y="460">• AB 2023/1542 Tak-Çıkar Yasası: Her çeyrek ekran-batarya parçası aletsiz 3 sn içinde değişir.</text>
<text class="lbls" x="730" y="480">• Portsuz Gövde ve Qi2 Şarj: Gövdede Type-C yoktur; herhangi bir kablosuz şarjda şarj olur.</text>
<text class="lbls" x="730" y="500">• Doğal Boşluktan 90° Bükülen B: 1.00 mm çubuk yukarıda yatay olarak ekran üstüne tam oturur;</text>
<text class="lbls" x="730" y="518">  çubuk hariç kalan yuvarlak kısım boşluktan bükülerek ekran önünde bize doğru bakar.</text>
<rect class="glass" x="40" y="596" width="650" height="158" rx="6"/>
<text class="t h2" x="60" y="622">C · GÖZLÜK / EL SAĞLIĞI VE AB 2023/1542 TAK-ÇIKAR YASASI</text>
<text class="lbls" x="60" y="646">1. Yanmaz Katı-Hal Pil: 4 x 3.0 Wh = 12.0 Wh LLZO/PEO-LiBOB; delinse bile alev ve HF gazı yok.</text>
<text class="lbls" x="60" y="666">2. Göz Önü Termal Kilit: Çift NTC ve grafen/Mu-metal kalkan ile sıcaklık &lt;=36.2 C sınırındadır.</text>
<text class="lbls" x="60" y="686">3. Düşük EM ve SAR: Bifilar kulaklar ile ELF &lt;0.08 µT; baş/göz SAR değeri 0.054 W/kg (37x güvenli).</text>
<text class="lbls" x="60" y="706">4. Biyouyumlu Yüzey: ISO 10993-5/-10/-23 tıbbi BPA-free PC ve titreşimsiz DC-dimming T-OLED.</text>
<text class="lbls" x="60" y="726">5. Aletsiz Tak-Çıkar: 4 yapboz karo da AB 2023/1542 Md. 11 gereği 3 saniyede tek tek değişir.</text>
<rect class="glass" x="710" y="596" width="650" height="158" rx="6"/>
<text class="t h2" x="730" y="622">D · PORTSUZ KABLOSUZ GÖVDE VE 1 MM YATAY ÇUBUKLU B</text>
<text class="lbls" x="730" y="646">1. Gövdede Type-C Yok: Alt kısımda veya kenarlarda hiçbir port/buton yoktur (tam sızdırmaz IP68).</text>
<text class="lbls" x="730" y="666">2. Evrensel Kablosuz Şarj: Merkez Ø54 mm Qi2.2 + 4x Ø22 mm bobin ile her Qi pedde şarj olur.</text>
<text class="lbls" x="730" y="686">3. Tek Type-C B Modülünde: Kablolu 40W PD 3.1 şarj ve veri B&#39;nin 1.00 mm yatay üst çubuğundadır.</text>
<text class="lbls" x="730" y="706">4. Zorunlu Beyin: 4-Karo Ana TCON, Sıfır-CPU UWB/mmWave, kamera ve ses için B modülü şarttır.</text>
<text class="lbls" x="730" y="726">5. Ek Parçasız 90° Büküm: 1 mm çubuk üstte yatay durur, yuvarlak kısım önde bize doğru bakar.</text>
<rect class="glass" x="40" y="770" width="1320" height="106" rx="6"/>
<text class="t h2" x="60" y="798">E · KAPILAR F-01 … F-10 VE MON-1 … MON-20 (REVİZYON L.5.0)</text>
