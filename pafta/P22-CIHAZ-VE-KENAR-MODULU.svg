<text class="lblb" x="262" y="210">1 · 2.00 mm (R=6.35 mm) + Yapboz Kilitli 4 Karo (Q1-Q4)</text>
<text class="lbls" x="262" y="230">• 4 x (40 x 80 x 2.00 mm, 17 g) = 80 x 160 x 2.00 mm (68 g)</text>
<text class="lbls" x="262" y="248">• İç çekirdekte iki taraftan takılan girdili-çıktılı yapboz kilit</text>
<text class="lbls" x="262" y="266">• R=25.5 mm esnemede ayrılmaz (10 N/mm) · &lt;15 µm n=1.585 dudak</text>
<text class="lblb" x="262" y="302">2 · Gözlük, El ve Cep İçin Biyouyumlu Katı-Hal Pil (12 Wh)</text>
<text class="lbls" x="262" y="322">• Polikarbonat içinde yanmaz LLZO/PEO-LiBOB katı-hal pil</text>
<text class="lbls" x="262" y="340">• Sıfır sıvı, sıfır HF gazı (0.0 ppm), delinse bile alev almaz</text>
<text class="lbls" x="262" y="358">• Gözlük modu: &lt;=36.2 C sıcaklık, ELF &lt;0.08 µT, SAR 0.054 W/kg</text>
<text class="lbls" x="262" y="376">• ISO 10993 biyouyumlu BPA-free PC + DC-dimming mavi ışık filtre</text>
<text class="lblb" x="262" y="412">3 · Portsuz Qi2 Gövde + Boşluktan 90° Bükülen B Modülü</text>
<text class="lbls" x="262" y="432">• Gövdede Type-C veya buton YOKTUR; her Qi/Qi2 pedde şarj olur</text>
<text class="lbls" x="262" y="450">• Merkez Ø54 mm birleşik Qi2.2 bobin + 4 adet Ø22 mm çeyrek bobin</text>
<text class="lbls" x="262" y="468">• B&#39;nin 1.00 mm çubuğu yukarıda yatay olarak ekran üstüne oturur</text>
<text class="lbls" x="262" y="486">• Çubuk hariç kalan yuvarlak kısım boşluktan bükülüp bize bakar</text>
<text class="lbls" x="60" y="564">4-Parçalı (+) Yapboz Gövde: 80 x 160 x 2.00 mm (68 g, R=6.35 mm, 12 Wh Pil, Qi2) · 90° B Modülü (20 g, 1 mm Çubuk)</text>
<rect class="glass" x="710" y="154" width="650" height="426" rx="6"/>
<text class="t h2" x="730" y="180">B · (+) GİRDİLİ-ÇIKTILI YAPBOZ KİLİT VE 2.00 MM PİL KESİTİ</text>
<rect x="748" y="222" width="276" height="112" rx="14" fill="#dcecff" stroke="#18507e" stroke-width="1.6"/>
