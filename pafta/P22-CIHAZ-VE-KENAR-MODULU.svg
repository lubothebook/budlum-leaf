<text class="t h1" x="40" y="52">CİHAZ · TAMAMI ESNEYEBİLEN 2.00 MM (R=6.35 MM) (+) YAPBOZ POLİKARBONAT EKRAN VE 90° B</text>
<text class="s" x="40" y="78">80.0 x 160.0 x 2.00 mm (2 milim, 68 g, R = 6.35 mm, IoU = 0.999987) ekranın %100 tamamı esneyebilen polikarbonat (PC-PDMS + G = 0.035 MPa silikon OCA</text>
<text class="s" x="40" y="97">çoklu nötr düzlem, %0.35 gerinim, 1.4 N kuvvet) yapıdadır; ekranda hiçbir rijit bölge yoktur. İç çekirdekte iki taraftan takılan esnek PC-PDMS/NiTi</text>
<text class="s" x="40" y="116">yapboz kilit dişleri (24 çift, 10 N/mm), çift eksenli esnek LLZO/PEO katı-hal pil (12 Wh) ve esnek nanokristalin Qi2.2 bobinler yer alır; ekran R =</text>
<text class="s" x="40" y="135">25.5 mm kesintisiz esner ve ayrılmaz.</text>
