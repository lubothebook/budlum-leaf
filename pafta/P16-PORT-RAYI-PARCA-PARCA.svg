<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img" aria-label="Ortadaki (+) ciziksiz 4-karo kenetlenme barasi, portsuz govdede Qi2 kablosuz sarj ve 90 derece B cubugundaki tek Type-C">
  <title>BUDLUM LEAF · (+) ÇİZİKSİZ 4-KARO BARASI, Qİ2 BOBİNLERİ VE 90° B ÇUBUĞUNDA TEK TYPE-C</title>
  <style>
    .bg{fill:#fbfaf7}
    .t{font-family:Helvetica,Arial,sans-serif;fill:#181816}
    .h1{font-size:24px;font-weight:700}
    .h2{font-size:15px;font-weight:700}
    .h3{font-size:12.5px;font-weight:700}
