  <rect class="bg" x="0" y="0" width="1400" height="980"/>
<text class="t h1" x="40" y="52">4-PARÇALI (+) KATI-HAL BATARYA · GÖZLÜK SAĞLIĞI VE EVRENSEL Qİ2 ŞARJ</text>
<text class="s" x="40" y="78">Kaba alt batarya modülü iptal edilmiştir: telefon ortasından artı (+) şeklinde 4 eşit polikarbonat ekran-batarya parçasına (Q1-Q4; 40x80x2.00 mm, 4x</text>
<text class="s" x="40" y="97">3.0 Wh = 12.0 Wh) bölünmüştür. Gözlük olarak göze takıldığında, elde ve cepte tam sağlıklıdır.</text>
<line class="rule" x1="40" y1="116" x2="1360" y2="116"/>
<rect class="glass" x="40" y="132" width="860" height="292" rx="6"/>
<text class="t h2" x="60" y="160">A · 4-KARO (+) İÇ KESİT PLANI · 4 x (40 x 80 x 2.20 MM) = 52 İÇ PARÇA</text>
<rect fill="#dcecff" stroke="#18507e" stroke-width="2.0" x="90.0" y="178.0" width="736.0" height="200.0" rx="14"/>
<rect fill="#b8ebd8" stroke="#1b8a6b" stroke-width="1.3" x="108.4" y="188.0" width="340.4" height="85.0" rx="6"/>
<circle cx="278.6" cy="230.5" r="22" fill="none" stroke="#c88a18" stroke-width="1.4" stroke-dasharray="4 2"/>
<text class="lbls" x="145.2" y="235.5">Q1 · 3.0 Wh LLZO</text>
<rect fill="#b8ebd8" stroke="#1b8a6b" stroke-width="1.3" x="467.2" y="188.0" width="340.4" height="85.0" rx="6"/>
<circle cx="637.4" cy="230.5" r="22" fill="none" stroke="#c88a18" stroke-width="1.4" stroke-dasharray="4 2"/>
<text class="lbls" x="504.0" y="235.5">Q3 · 3.0 Wh LLZO</text>
<rect fill="#b8ebd8" stroke="#1b8a6b" stroke-width="1.3" x="108.4" y="283.0" width="340.4" height="85.0" rx="6"/>
<circle cx="278.6" cy="325.5" r="22" fill="none" stroke="#c88a18" stroke-width="1.4" stroke-dasharray="4 2"/>
<text class="lbls" x="145.2" y="330.5">Q2 · 3.0 Wh LLZO</text>
<rect fill="#b8ebd8" stroke="#1b8a6b" stroke-width="1.3" x="467.2" y="283.0" width="340.4" height="85.0" rx="6"/>
<circle cx="637.4" cy="325.5" r="22" fill="none" stroke="#c88a18" stroke-width="1.4" stroke-dasharray="4 2"/>
<text class="lbls" x="504.0" y="330.5">Q4 · 3.0 Wh LLZO</text>
<line x1="458.0" y1="178.0" x2="458.0" y2="378.0" stroke="#1b8a6b" stroke-width="2.2"/>
<line x1="90.0" y1="278.0" x2="826.0" y2="278.0" stroke="#1b8a6b" stroke-width="2.2"/>
<circle cx="458.0" cy="278.0" r="52" fill="none" stroke="#d89818" stroke-width="2.6" stroke-dasharray="10 4"/>
<rect fill="#d8dbe0" stroke="#181816" stroke-width="1.4" x="448.0" y="268.0" width="20" height="20" rx="3"/>
<text class="lbls" x="60" y="394">• Her karoda (40x80 mm): 35x75x1.08 mm yanmaz LLZO katı-hal pil (3.0 Wh) + Ø22 mm Qi bobin + 90° Qi2.2 sektör + U_QI PMIC.</text>
<text class="lbls" x="60" y="412">• Merkezde (+): 12 µm n=1.585 çiziksiz optik dudak + Titanyum Artı göbek + 24 N52H mıknatıs + 64 altın mikro-yaprak kontak.</text>
<rect class="glass" x="920" y="132" width="440" height="292" rx="6"/>
<text class="t h2" x="940" y="160">B · SAĞLIK VE ENERJİ FİZİĞİ (REV L.5.0)</text>
<text class="lblb" x="940" y="192">Tek Çeyrek Karo</text>
<text class="lbls" x="1085" y="192">LLZO Katı</text>
<text class="lbls" x="1175" y="192">3.0 Wh</text>
<text class="lbls" x="1260" y="192">800 mAh</text>
<text class="lblb" x="940" y="218">4-Karo Tam Ekran</text>
<text class="lbls" x="1085" y="218">750 Wh/L</text>
<text class="lbls" x="1175" y="218">12.0 Wh</text>
<text class="lbls" x="1260" y="218">3 200 mAh</text>
<text class="lblb" x="940" y="244">Göz Sıcaklığı</text>
<text class="lbls" x="1085" y="244">NTC Kilit</text>
<text class="lbls" x="1175" y="244">&lt;=36.2 C</text>
<text class="lbls" x="1260" y="244">IEC 60601</text>
<text class="lblb" x="940" y="270">SAR ve Manyetik</text>
<text class="lbls" x="1085" y="270">Mu-Metal</text>
<text class="lbls" x="1175" y="270">0.054 W/kg</text>
<text class="lbls" x="1260" y="270">&lt;0.08 µT</text>
<text class="s" x="940" y="308">Sıfır-CPU mimarisinde 4 karo toplam gücü</text>
<text class="s" x="940" y="327">yalnız 0.85 W'tır: polikarbonat içindeki 12.0</text>
<text class="s" x="940" y="346">Wh (3 200 mAh) katı-hal pil &gt;14.1 saat</text>
<text class="s" x="940" y="365">kesintisiz ekran süresi verir. Sıvı elektrolit</text>
<text class="s" x="940" y="384">ve LiPF6 içermez; delinse bile yanmaz ve HF</text>
<text class="s" x="940" y="403">gazı çıkarmaz.</text>
<rect class="glass" x="40" y="440" width="1320" height="246" rx="6"/>
<text class="t h2" x="60" y="470">C · AB 2023/1542 ALETSİZ 3 SN KARO DEĞİŞİMİ (HOT-SWAP) VE EVRENSEL Qİ2 ŞARJ</text>
<rect class="live" x="60" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="72" y="518">1 · 1 karoyu + hattından çek</text>
<rect class="gd" x="72" y="536" width="150" height="14" rx="3"/>
<rect class="gsk" x="210" y="554" width="16" height="12" rx="3"/>
<rect class="live" x="278" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="290" y="518">2 · Dead-Pad 0.1 ms keser</text>
<rect class="gd" x="290" y="536" width="138" height="14" rx="3"/>
<rect class="gsk" x="428" y="554" width="16" height="12" rx="3"/>
<rect class="live" x="496" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="508" y="518">3 · diğer 3 karo (9 Wh) besler</text>
<rect class="gd" x="508" y="536" width="126" height="14" rx="3"/>
<rect class="gsk" x="646" y="554" width="16" height="12" rx="3"/>
<rect class="live" x="714" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="726" y="518">4 · kesintisiz ekran/oturum</text>
<rect class="gd" x="726" y="536" width="114" height="14" rx="3"/>
<rect class="gsk" x="864" y="554" width="16" height="12" rx="3"/>
<rect class="live" x="932" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="944" y="518">5 · yeni karo + hatta oturur</text>
<rect class="gd" x="944" y="536" width="102" height="14" rx="3"/>
<rect class="gsk" x="1082" y="554" width="16" height="12" rx="3"/>
<rect class="live" x="1150" y="492" width="196" height="82" rx="6"/>
<text class="lbls" x="1162" y="518">6 · n=1.585 çiziksiz kilit</text>
<rect class="gd" x="1162" y="536" width="90" height="14" rx="3"/>
<rect class="gsk" x="1300" y="554" width="16" height="12" rx="3"/>
<text class="s" x="60" y="610">Herhangi bir çeyrek karo (Q1-Q4) çıkarıldığında kalan 3 karo (9.0 Wh) sistemi kesintisiz beslemeye devam eder; yeni karo takıldığında 3 ms Dead-Pad</text>
<text class="s" x="60" y="629">doğrulamasıyla + güç barasına katılır. Gövde herhangi bir Qi / Qi2.2 şarj pedinde kablosuz şarj olur.</text>
<rect class="glass" x="40" y="702" width="1320" height="256" rx="6"/>
<text class="t h2" x="60" y="732">D · BİYOUYUMLULUK KANITI · GÖZLÜK OLARAK GÖZDE, ELDE VE CEPTE NEDEN TAM SAĞLIKLI?</text>
<path d="M 85 785 Q 290 725 495 785" stroke="#1b8a6b" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M 85 799 Q 290 739 495 799" stroke="#1b8a6b" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M 85 813 Q 290 753 495 813" stroke="#1b8a6b" stroke-width="6" fill="none" stroke-linecap="round"/>
<text class="lbls" x="85" y="852">1. Yanmaz LLZO/PEO katı-hal pil: %0 sıvı, 0.0 ppm HF gazı, %0 şişme</text>
<text class="lbls" x="85" y="872">2. Gözlük termal kilidi: ortotropik grafen + NTC ile göz yüzeyi &lt;=36.2 C</text>
<text class="lbls" x="85" y="892">3. Bifilar akım iptali (&lt;0.08 µT) + 90° B çubukta anten (SAR 0.054 W/kg)</text>
<text class="s" x="540" y="764">1. Kimyasal Güvenlik: Sıradan telefonlardaki yanıcı sıvı organik solventler ve LiPF6 tuzu</text>
<text class="s" x="540" y="783">tamamen kaldırılmış, yerine inorganik LLZO seramik + PEO katı elektrolit konmuştur; kesilse</text>
<text class="s" x="540" y="802">veya bükülse bile alev almaz ve zehirli HF gazı üretmez. 2. Göz ve Deri Sağlığı: Yüzey ISO</text>
<text class="s" x="540" y="821">10993-5/-10 tıbbi polikarbonattır; ortotropik grafen + Mu-metal kalkan ısıyı kenarlara</text>
<text class="s" x="540" y="840">yayarak kornea/deri sıcaklığını &lt;=36.2 C'de tutar. Anten 90° B çubuğunda gözden uzakta</text>
<text class="s" x="540" y="859">durduğu için SAR yalnız 0.054 W/kg'dır.</text>
